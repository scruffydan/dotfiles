<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">SubMonokai colour palette</title>
  <desc id="desc">Background #272822, foreground #F8F8F2, sidebar #171714, selection #49483E. Accents: red #ED3A2C, orange #FF9800, yellow #E6DC6D, magenta #FB2B71, green #B3E435, cyan #00DFF3, blue #0097F3, and comments #75715E.</desc>
  <rect width="960" height="300" rx="16" fill="#272822"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="28" y="42" fill="#F8F8F2" font-size="25" font-weight="600">SubMonokai</text>
    <text x="932" y="40" fill="#B8BAB3" font-size="15" text-anchor="end">Sublime Text inspired · made for your apps</text>
    <g font-size="15">
      <rect x="28" y="64" width="214" height="78" rx="8" fill="#272822" stroke="#49483E"/>
      <text x="44" y="93" fill="#F8F8F2">Background</text>
      <text x="44" y="120" fill="#B8BAB3" font-family="monospace">#272822</text>
      <rect x="258" y="64" width="214" height="78" rx="8" fill="#F8F8F2"/>
      <text x="274" y="93" fill="#272822">Foreground</text>
      <text x="274" y="120" fill="#49483E" font-family="monospace">#F8F8F2</text>
      <rect x="488" y="64" width="214" height="78" rx="8" fill="#171714"/>
      <text x="504" y="93" fill="#F8F8F2">Sidebar</text>
      <text x="504" y="120" fill="#B8BAB3" font-family="monospace">#171714</text>
      <rect x="718" y="64" width="214" height="78" rx="8" fill="#49483E"/>
      <text x="734" y="93" fill="#F8F8F2">Selection</text>
      <text x="734" y="120" fill="#F8F8F2" font-family="monospace">#49483E</text>
    </g>
    <g>
      <rect x="28" y="168" width="99" height="56" rx="6" fill="#ED3A2C"/>
      <rect x="143" y="168" width="99" height="56" rx="6" fill="#FF9800"/>
      <rect x="258" y="168" width="99" height="56" rx="6" fill="#E6DC6D"/>
      <rect x="373" y="168" width="99" height="56" rx="6" fill="#FB2B71"/>
      <rect x="488" y="168" width="99" height="56" rx="6" fill="#B3E435"/>
      <rect x="603" y="168" width="99" height="56" rx="6" fill="#00DFF3"/>
      <rect x="718" y="168" width="99" height="56" rx="6" fill="#0097F3"/>
      <rect x="833" y="168" width="99" height="56" rx="6" fill="#75715E"/>
    </g>
    <g fill="#F8F8F2" font-size="14">
      <text x="28" y="249">Red</text>
      <text x="143" y="249">Orange</text>
      <text x="258" y="249">Yellow</text>
      <text x="373" y="249">Magenta</text>
      <text x="488" y="249">Green</text>
      <text x="603" y="249">Cyan</text>
      <text x="718" y="249">Blue</text>
      <text x="833" y="249">Comments</text>
    </g>
    <g fill="#B8BAB3" font-family="monospace" font-size="13">
      <text x="28" y="272">#ED3A2C</text>
      <text x="143" y="272">#FF9800</text>
      <text x="258" y="272">#E6DC6D</text>
      <text x="373" y="272">#FB2B71</text>
      <text x="488" y="272">#B3E435</text>
      <text x="603" y="272">#00DFF3</text>
      <text x="718" y="272">#0097F3</text>
      <text x="833" y="272">#75715E</text>
    </g>
  </g>
