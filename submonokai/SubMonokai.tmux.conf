# SubMonokai for tmux 3.8+

# Base colours
%hidden bg="#272822"
%hidden bg_dim="#1D1E19"
%hidden fg="#F8F8F2"
%hidden selection="#49483E"
%hidden comment="#75715E"

# Accent colours
%hidden red="#ED3A2C"
%hidden orange="#FF9800"
%hidden yellow="#E6DC6D"
%hidden magenta="#FB2B71"
%hidden green="#B3E435"
%hidden cyan="#00DFF3"
%hidden blue="#0097F3"
%hidden black="#1D1E19"

set -s theme dark
# Palette values are formats: preserve literal RGB hashes instead of expanding
# shortcuts such as #F (window flags) in orange, white, and magenta.
set -s dark-theme-black "#{l:$black}"
set -s dark-theme-white "#{l:$fg}"
set -s dark-theme-dark-grey "#{l:$bg}"
set -s dark-theme-light-grey "#{l:$comment}"
set -s dark-theme-red "#{l:$red}"
set -s dark-theme-green "#{l:$green}"
# tmux has no orange slot; yellow controls selections, prompts, and copy mode.
set -s dark-theme-yellow "#{l:$orange}"
set -s dark-theme-blue "#{l:$blue}"
set -s dark-theme-magenta "#{l:$magenta}"
set -s dark-theme-cyan "#{l:$cyan}"

# Preserve the original UI colours while using the native palette.
set -g popup-style "fg=themewhite,bg=themeblack"
set -g popup-border-style "fg=themewhite,bg=themeblack"
set -g menu-style "fg=themewhite,bg=themeblack"
set -g menu-border-style "fg=themewhite,bg=themeblack"
set -g menu-selected-style "fg=themeblack,bg=themeyellow"
set -g tree-mode-border-style "fg=themewhite,bg=default"
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},themeyellow,themecyan},bg=default"
set -g copy-mode-mark-style "fg=themeblack,bg=themered"
set -g display-panes-border-style "fg=default,bg=default"
set -g pane-border-style "fg=default,bg=default"
# The original terminal's ANSI green slot is SubMonokai yellow.
set -g pane-active-border-style "#{?pane_in_mode,fg=themeyellow,#{?synchronize-panes,fg=themered,fg=#$yellow}},bg=default"
# Clear tmux 3.8's default underline; the format below supplies active-tab colours.
set -g window-status-current-style "none"

# Custom status bar and pane backgrounds
set -g status-style "fg=$yellow,bg=$selection"
set -g window-status-separator ""
# Keep inline RGB colours for FreeBSD tmux compatibility.
set -g window-status-current-format "#[fg=$black,bg=$orange] #I:#W#{?window_zoomed_flag,[Z],} #[default]"
set -g window-status-format " #I:#W#{?window_zoomed_flag,[Z],} "
set -g window-status-activity-style "fg=$cyan"

# Pane backgrounds (focus hooks require focus-events on in the user's config).
set -g window-style "bg=$bg_dim"
set -g window-active-style "bg=$bg"
# Resolve the inactive style at redraw time so theme reloads reach dimmed panes.
# On focus, inherit the global active style instead of keeping a local copy.
set-hook -g client-focus-out "set window-active-style '#{window-style}'"
set-hook -g client-focus-in "set -u window-active-style"
