# Appearance is maintained upstream and bundled by the SubMonokai subtree sync.
source-file ~/dotfiles/submonokai/SubMonokai.tmux.conf

########################
## Environment Setup ###
########################

# Set the default terminal mode to 256color mode with true color support
set -g default-terminal "tmux-256color"
# Reserve fixed slots so reloads replace these entries instead of appending them.
set -s terminal-overrides[100] "*256col*:RGB"
set -s terminal-overrides[101] "ghostty:RGB"

# Enable focus events for better Neovim/Vim integration
set -g focus-events on

# Allow terminal UI passthrough even from hidden panes so progress can clear reliably
set -g allow-passthrough all

# Change Prefix
set -g prefix C-a

# Reload tmux conf and refresh client to resync window size
bind r source-file ~/.tmux.conf\; refresh-client -c\; display "Config Reloaded! Client Resynced!"

# Set Delay between prefix and command. Allows for faster key repetition
set -s escape-time 0

# Set mouse mode
set -g mouse on
bind -r m \
    set -g mouse

# Set Scrollback buffer
set-option -g history-limit 10000

# Set terminal title to session name
set -g set-titles on
set -g set-titles-string "#S"

### Set base for Windows and Panes to 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Only resize a window down to the smaller size if the smaller client is actually looking at it
# (causes issues with tmux -CC)
set -g aggressive-resize on


########################
# Status bar settings ##
########################

# Status bar settings
set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left

set -g status-right " #H |#(uptime | awk -F'[a-z]:' '{ print $2}') "


# Enable activity alerts
set -g monitor-activity on
set -g visual-activity on


########################
##### Key Bindings #####
########################

#Send Ctrl-A to apps inside tmux
bind C-a send-prefix

### Display Menu ###
bind C-q display-menu -x P -y P \
    "New Session"                        S "command-prompt -p \"New Session:\" \"new-session -A -s '%%'\"" \
    "Rename Session"                     . "command-prompt -I \"#S\" \"rename-session '%%'\"" \
    "Kill Session"                       x "kill-session" \
    "Kill Other Session(s)"              X "kill-session -a" \
    "" \
    "Rename Window"                      , "command-prompt -I \"#W\" \"rename-window '%%'\"" \
    "Kill Window"                        W "killw"  \
    "Move Window to Session"             m "display-popup -E \"sh ~/dotfiles/tmux/move-window-to-session.sh\"" \
    "Swap Window Right"                  r "swap-window -t +1" \
    "Swap Window Left"                   l "swap-window -t -1" \
    "" \
    "Swap Pane Up"                       "{" "swap-pane -U" \
    "Swap Pane Down"                     "}" "swap-pane -D" \
    "Break Pane"                         t break-pane \
    "Join Pane"                          J "choose-window 'join-pane -h -s \"%%\"'" \
    "Kill Pane"                          K kill-pane \
    "" \
    "Layout: Even Horizontal"            1 "select-layout even-horizontal" \
    "Layout: Even Vertical"              2 "select-layout even-vertical" \
    "Layout: Main Horizontal"            3 "select-layout main-horizontal" \
    "Layout: Main Vertical"              4 "select-layout main-vertical" \
    "Layout: Tiled"                      5 "select-layout tiled"

# Vi-style navigation for menus (only active when menu is open)
bind-key -T menu-select j send-keys -X menu-down
bind-key -T menu-select k send-keys -X menu-up
bind-key -T menu-select h send-keys -X menu-left
bind-key -T menu-select l send-keys -X menu-right


### Sessions ###

# Fuzzy find session switch
bind C-s display-popup -E "tmux list-sessions -F '#{session_name}' | grep -v \"^$(tmux display-message -p '#S')$\" | fzf --reverse | xargs -I {} tmux switch-client -t {}"

# Rename session
bind . command-prompt -I "#S" "rename-session '%%'"

### Windows ###

# Make new window start in current directory
bind c new-window -c "#{pane_current_path}"

# Make movement between windows repeatable
bind -r n next-window
bind -r N previous-window

### Panes ###

# Split panes with | and - in current directory
bind '\' split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Make Swap Panes repeatable
# Unbind first to clear any default non-repeat settings
unbind "{"
unbind "}"
bind -r "{" swap-pane -U
bind -r "}" swap-pane -D

# Swap the active pane with its directional neighbor without wrapping.
bind C-S-Left  if -F '#{?pane_at_left,0,1}'   { swap-pane -d -s '{active}' -t '{left-of}' }
bind C-S-Down  if -F '#{?pane_at_bottom,0,1}' { swap-pane -d -s '{active}' -t '{down-of}' }
bind C-S-Up    if -F '#{?pane_at_top,0,1}'    { swap-pane -d -s '{active}' -t '{up-of}' }
bind C-S-Right if -F '#{?pane_at_right,0,1}'  { swap-pane -d -s '{active}' -t '{right-of}' }

# Resize Panes
bind -r H resize-pane -L
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R

# moving between panes with vim movement keys (no wrap)
bind -r h if -F '#{?pane_at_left,0,1}'   'select-pane -L'
bind -r j if -F '#{?pane_at_bottom,0,1}' 'select-pane -D'
bind -r k if -F '#{?pane_at_top,0,1}'    'select-pane -U'
bind -r l if -F '#{?pane_at_right,0,1}'  'select-pane -R'

### Display Popup ###
# -E closes popup only when shell/command exits (not on Escape)
bind ` display-popup -E -w 90% -h 90% -d "#{pane_current_path}"
bind '~' display-popup -E -w 90% -h 90% -d "#{pane_current_path}"


########################
## Vi CopyPaste mode ###
########################

set -g mode-keys vi
bind Escape copy-mode
bind p paste-buffer
bind P choose-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi 'C-c' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Load additional config if MacOS
if-shell "uname | grep -q Darwin" "source-file ~/dotfiles/tmux/tmux.mac.conf"
