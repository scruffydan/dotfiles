# SubMonokai for tmux 3.4+

# Base colours
%hidden bg="#272822"
%hidden bg_dim="#1D1E19"
%hidden fg="#F8F8F2"
%hidden selection="#49483E"
%hidden comment="#75715E"

# Accent colours
%hidden red="#ED3A2C"
%hidden orange="#FF9800"
%hidden yellow="#E6DC6D"
%hidden magenta="#FB2B71"
%hidden green="#B3E435"
%hidden cyan="#00DFF3"
%hidden blue="#0097F3"
%hidden black="#1D1E19"

# The server's theme option exists on 3.8+: detect the capability directly.
%if "#{theme}"
set -s theme dark
set -s dark-theme-black "$black"
set -s dark-theme-white "$fg"
set -s dark-theme-dark-grey "$bg"
set -s dark-theme-light-grey "$comment"
set -s dark-theme-red "$red"
set -s dark-theme-green "$green"
# tmux has no orange slot; yellow controls selections, prompts, and copy mode.
set -s dark-theme-yellow "$orange"
set -s dark-theme-blue "$blue"
set -s dark-theme-magenta "$magenta"
set -s dark-theme-cyan "$cyan"

# Restore native UI roles, including when reloading the previous export.
# These defaults reference the palette above instead of individual RGB styles.
set -gu popup-style
set -gu popup-border-style
set -gu menu-style
set -gu menu-border-style
set -gu tree-mode-border-style
set -gu tree-mode-preview-style
set -gu copy-mode-mark-style
set -gu display-panes-border-style
set -gu pane-border-style
set -gu pane-active-border-style
set -gu window-status-current-style
%else
# tmux 3.4-3.7: keep the original terminal ANSI colours and explicit styles.
# Named ANSI colours are intentional: ANSI yellow is orange in SubMonokai.

# Popups and menus
set -g popup-style "fg=$fg,bg=$black"
set -g popup-border-style "fg=$fg,bg=$black"
set -g menu-style "fg=$fg,bg=$black"
set -g menu-border-style "fg=$fg,bg=$black"

# Session, window, and pane tree previews
# Inherit the pane background so preview frames blend into the view.
set -gq tree-mode-border-style "fg=$fg,bg=default"
set -gq tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#$orange,#$cyan},bg=default"

# Preserve pre-3.8 marked-line and divider colours and backgrounds.
set -g copy-mode-mark-style "fg=black,bg=red"
set -gq display-panes-border-style "fg=default,bg=default"
set -g pane-border-style "fg=default,bg=default"
set -g pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=green}},bg=default"
%endif

# Custom status bar and pane backgrounds are shared by both theme paths.
set -g status-style "fg=$yellow,bg=$selection"
set -g window-status-separator ""
# Keep inline RGB colours for FreeBSD tmux compatibility.
set -g window-status-current-format "#[fg=$black,bg=$orange] #I:#W#{?window_zoomed_flag,[Z],} #[default]"
set -g window-status-format " #I:#W#{?window_zoomed_flag,[Z],} "
set -g window-status-activity-style "fg=$cyan"

# Pane backgrounds (focus hooks require focus-events on in the user's config).
set -g window-style "bg=$bg_dim"
set -g window-active-style "bg=$bg"
# Resolve the inactive style at redraw time so theme reloads reach dimmed panes.
# On focus, inherit the global active style instead of keeping a local copy.
set-hook -g client-focus-out "set window-active-style '#{window-style}'"
set-hook -g client-focus-in "set -u window-active-style"
