name: Set up tmux 3.8
description: Build the pinned upstream release so native theme tests cannot silently skip.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y build-essential libevent-dev libncurses-dev bison pkg-config autoconf automake
        build_dir=$(mktemp -d "$RUNNER_TEMP/tmux-build.XXXXXX")
        git -C "$build_dir" init
        git -C "$build_dir" fetch --depth=1 https://github.com/tmux/tmux.git 7f2a35ad3321f9ba57a1062ca73b1f3ff26aca53
        git -C "$build_dir" checkout --detach FETCH_HEAD
        cd "$build_dir"
        sh autogen.sh
        ./configure --prefix="$RUNNER_TEMP/tmux-3.8"
        make -j2
        make install
        "$RUNNER_TEMP/tmux-3.8/bin/tmux" -V
        printf '%s\n' "$RUNNER_TEMP/tmux-3.8/bin" >> "$GITHUB_PATH"
